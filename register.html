<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">

<div class="card p-4 bg-black text-white" style="width:400px;">
<h3 class="text-center mb-3">Join the Fleet</h3>
<input type="text" id="name" class="form-control mb-3" placeholder="Full Name">
<input type="email" id="email" class="form-control mb-3" placeholder="Email">
<input type="password" id="password" class="form-control mb-3" placeholder="Password">
<input type="text" id="simbrief" class="form-control mb-3" placeholder="SimBrief Username">
<button class="btn btn-primary w-100" onclick="register()">Create Account</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
